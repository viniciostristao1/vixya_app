name: vixya_app
description: "Vixya — cliente do gerador automático de vídeos de marketing."
publish_to: 'none'
version: 0.1.18+19

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  file_picker: ^8.1.0
  video_player: ^2.9.0
  share_plus: ^10.0.0
  path_provider: ^2.1.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

# ícone do app (gerado na CI: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 23
