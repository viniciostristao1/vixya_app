name: vixya_app
description: "Vixya — cliente do gerador automático de vídeos de marketing."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  file_picker: ^8.1.0
  video_player: ^2.9.0
  share_plus: ^10.0.0
  path_provider: ^2.1.0
  shared_preferences: ^2.3.0

# força uma versão do lifecycle que não exige compileSdk 36 (evita conflito de AAR no build)
dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.17

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
