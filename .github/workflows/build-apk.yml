name: Build APK

# Gera um APK de teste na nuvem a cada push no app. Sem Firebase (o Vixya fala só com a VPS).
# O android/ NÃO é versionado — o CI o gera com `flutter create` e restaura o nosso lib/pubspec.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7

      # gera android/ (e outros) a partir do pubspec; depois restaura nosso codigo
      - name: Gerar scaffold de plataforma
        working-directory: app
        run: |
          flutter create --platforms=android --org com.vinyapps --project-name vixya_app .
          git checkout -- lib pubspec.yaml || true
          # plugins (file_picker/video_player) exigem minSdk >= 23
          if [ -f android/app/build.gradle.kts ]; then
            sed -i -E 's/minSdk *= *flutter\.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i -E 's/(minSdk(Version)?)[ =]+flutter\.minSdkVersion/\1 23/' android/app/build.gradle
          fi
          echo "== minSdk ==" ; grep -rn "minSdk" android/app/build.gradle* || true

      - name: Dependências
        working-directory: app
        run: flutter pub get

      - name: Build APK (release, split por ABI)
        working-directory: app
        run: flutter build apk --release --split-per-abi

      - name: Publicar APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: vixya-apk
          path: app/build/app/outputs/flutter-apk/*.apk
