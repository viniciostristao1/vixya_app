name: Build APK

# Gera um APK de teste na nuvem a cada push no app. Sem Firebase (o Vixya fala só com a VPS).
# O android/ NÃO é versionado — o CI o gera com `flutter create` e restaura o nosso lib/pubspec.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # gera android/ (e outros) a partir do pubspec; depois restaura nosso codigo
      - name: Gerar scaffold de plataforma
        working-directory: app
        run: |
          flutter --version
          flutter create --platforms=android --org com.vinyapps --project-name vixya_app .
          git checkout -- lib pubspec.yaml || true
          # app em compileSdk 36 / minSdk 23 (belt-and-suspenders)
          sed -i -E 's/compileSdk *= *flutter\.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          sed -i -E 's/minSdk *= *flutter\.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts

      - name: Dependências
        working-directory: app
        run: |
          flutter pub get
          # plugins compilam com flutter.compileSdkVersion (35); alguns exigem 36 -> forca 36
          find ~/.pub-cache -type f \( -name build.gradle -o -name build.gradle.kts \) -path '*/android/*' -exec sed -i 's/flutter\.compileSdkVersion/36/g' {} +
          echo "=== DIAG file_picker gradle ==="
          find ~/.pub-cache -path '*file_picker*/android/build.gradle*' | while read f; do echo "== $f =="; grep -nE 'compileSdk|namespace' "$f" || true; done
          echo "=== DIAG lifecycle gradle ==="
          find ~/.pub-cache -path '*flutter_plugin_android_lifecycle*/android/build.gradle*' | while read f; do echo "== $f =="; grep -nE 'compileSdk|namespace' "$f" || true; done

      - name: Build APK (release, split por ABI)
        working-directory: app
        run: flutter build apk --release --split-per-abi

      - name: Publicar APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: vixya-apk
          path: app/build/app/outputs/flutter-apk/*.apk
