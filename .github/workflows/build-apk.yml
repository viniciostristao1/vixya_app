name: Build APK

# Gera um APK de teste na nuvem a cada push no app. Sem Firebase (o Vixya fala só com a VPS).
# O android/ NÃO é versionado — o CI o gera com `flutter create` e restaura o nosso lib/pubspec.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # gera android/ (e outros) a partir do pubspec; depois restaura nosso codigo
      - name: Gerar scaffold de plataforma
        working-directory: app
        run: |
          flutter --version
          flutter create --platforms=android --org com.vinyapps --project-name vixya_app .
          git checkout -- lib pubspec.yaml || true
          # app em compileSdk 36 / minSdk 23 (belt-and-suspenders)
          sed -i -E 's/compileSdk *= *flutter\.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          sed -i -E 's/minSdk *= *flutter\.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Dependências
        working-directory: app
        run: |
          flutter pub get
          # plugins compilam com flutter.compileSdkVersion (35); alguns exigem 36 -> forca 36
          # varios plugins FIXAM compileSdk baixo (ex.: file_picker=34); forca 36 em todos
          find ~/.pub-cache -type f -name build.gradle -path '*/android/*' -exec sed -i -E 's/(compileSdk(Version)?)[[:space:]]+(flutter\.compileSdkVersion|[0-9]+)/\1 36/g' {} +
          find ~/.pub-cache -type f -name build.gradle.kts -path '*/android/*' -exec sed -i -E 's/(compileSdk)[[:space:]]*=[[:space:]]*(flutter\.compileSdkVersion|[0-9]+)/\1 = 36/g' {} +
          echo "file_picker apos patch:"; grep -rn 'compileSdk' ~/.pub-cache/hosted/pub.dev/file_picker-*/android/build.gradle || true

      - name: Build APK (release, universal, assinado com chave fixa)
        working-directory: app
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > upload-keystore.jks
          flutter build apk --release \
            -Pandroid.injected.signing.store.file=$(pwd)/upload-keystore.jks \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias=upload \
            -Pandroid.injected.signing.key.password="$KS_PASS"

      - name: Publicar APK como Release (link direto p/ o celular)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag 2>/dev/null || true
          gh release create latest app/build/app/outputs/flutter-apk/app-release.apk \
            --title "Vixya — APK mais recente" \
            --notes "Baixe o app-release.apk e instale no Android (permita 'instalar de fontes desconhecidas'). Depois abra Configurações no app e informe a URL do backend + o token."

      - name: APK tambem como artifact
        uses: actions/upload-artifact@v4
        with:
          name: vixya-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
